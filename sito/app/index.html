<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E5A4D">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}</style>
<title>Avanzo</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: header con saldo "fino allo stipendio" + schede; contenuto a griglia che diventa una colonna sul telefono; tasto + fisso in basso a destra */
:root {
  --bg: #F3F5F2; --panel: #FFFFFF; --ink: #10231F; --muted: #55665F; --line: #D5DDD8; --soft: #E7EEEA;
  --accent: #0E5A4D; --accent-ink: #FFFFFF; --sun: #F2C14E; --sun-soft: #FBEFC9;
  --ok: #1D7A4F; --warn: #9A6400; --bad: #B3261E;
  --s1: #0E5A4D; --s2: #C98A00; --s3: #7B6CC4; --s-muted: #A9B6B0;
  --display: 'Bricolage Grotesque', 'Avenir Next', system-ui, sans-serif;
  --body: 'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --mono: 'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, monospace;
  --r: 14px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0D1714; --panel: #15221E; --ink: #E6EEEA; --muted: #9DB0A8; --line: #2A3A35; --soft: #1C2C27;
  --accent: #5CC7AE; --accent-ink: #08201B; --sun: #F2C14E; --sun-soft: #3A3018;
  --ok: #6BD39C; --warn: #F0B54A; --bad: #FF8A80;
  --s1: #5CC7AE; --s2: #F0B54A; --s3: #A99BF0; --s-muted: #4D615A; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0D1714; --panel: #15221E; --ink: #E6EEEA; --muted: #9DB0A8; --line: #2A3A35; --soft: #1C2C27;
  --accent: #5CC7AE; --accent-ink: #08201B; --sun: #F2C14E; --sun-soft: #3A3018;
  --ok: #6BD39C; --warn: #F0B54A; --bad: #FF8A80;
  --s1: #5CC7AE; --s2: #F0B54A; --s3: #A99BF0; --s-muted: #4D615A; color-scheme: dark }

body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.5; }
.wrap { max-width: 1180px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 20px 120px; }
h1, h2, h3 { text-wrap: balance; }
.num, td.n, .big { font-variant-numeric: tabular-nums; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* header */
.top { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
.brand { display: flex; gap: 10px; align-items: center; font-family: var(--display); font-weight: 700; font-size: 20px; letter-spacing: -0.01em; }
.brand svg { flex: none; }
.who { color: var(--muted); font-size: 14px; }
.demo-bar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; background: var(--sun-soft); border-radius: var(--r); padding: 10px 14px; margin-bottom: 16px; font-size: 14px; }
.demo-bar b { font-weight: 600; }
.hero { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr); gap: 16px; margin-bottom: 18px; }
.hero-main { background: var(--accent); color: var(--accent-ink); border-radius: 18px; padding: 22px 24px; display: grid; gap: 4px; align-content: start; }
.hero-main .lbl { opacity: .85; font-size: 14px; }
.hero-main .big { font-family: var(--mono); font-size: clamp(36px, 7vw, 54px); line-height: 1.05; letter-spacing: -0.02em; }
.hero-main .sub { opacity: .9; font-size: 14px; }
.hero-side { background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: 18px 20px; font-size: 14px; display: grid; gap: 6px; align-content: start; }
.hero-side p { margin: 0; }
.tabs { display: flex; gap: 2px; overflow-x: auto; border-bottom: 1px solid var(--line); margin-bottom: 18px; scrollbar-width: none; }
.tab { appearance: none; background: none; border: 0; border-bottom: 2px solid transparent; padding: 10px 12px; color: var(--muted); white-space: nowrap; min-height: 44px; }
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--ink); font-weight: 600; }

/* blocks */
.grid { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 19rem), 1fr)); margin-bottom: 14px; }
.tiles { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 10.5rem), 1fr)); margin-bottom: 14px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; min-width: 0; position: relative; }
.card h2 { font-size: 16px; font-weight: 600; margin: 0 0 2px; }
.note { color: var(--muted); font-size: 13px; margin: 0 0 12px; }
.tile .lbl { color: var(--muted); font-size: 13px; }
.tile .big { font-family: var(--mono); font-size: 24px; margin: 4px 0 2px; letter-spacing: -0.01em; }
.tile .sub { color: var(--muted); font-size: 12px; }
.ok { color: var(--ok); } .warn { color: var(--warn); } .bad { color: var(--bad); }
.list { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.list li { display: flex; gap: 10px; align-items: baseline; }
.dot { flex: none; width: 8px; height: 8px; border-radius: 50%; transform: translateY(-1px); }
.dot.bad { background: var(--bad); } .dot.warn { background: var(--warn); } .dot.ok { background: var(--ok); }
.row { display: flex; justify-content: space-between; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--line); }
.row:last-child { border-bottom: 0; }
.row .sub { color: var(--muted); font-size: 12px; }
.track { position: relative; height: 10px; border-radius: 99px; background: var(--soft); margin: 8px 0; }
.fill { position: absolute; inset: 0 auto 0 0; border-radius: 99px; background: var(--s1); }
.fill.warn { background: var(--warn); } .fill.bad { background: var(--bad); }
.today { position: absolute; top: -4px; bottom: -4px; width: 2px; background: var(--ink); }
.chip { display: inline-block; font-size: 12px; font-weight: 500; padding: 1px 8px; border-radius: 99px; border: 1px solid currentColor; white-space: nowrap; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; color: var(--muted); font-size: 12px; margin-bottom: 6px; }
.sw { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }
.chart { position: relative; min-height: 220px; }
.chart svg { display: block; width: 100%; height: auto; overflow: visible; }
.chart text { fill: var(--muted); font-size: 11px; font-family: var(--body); }
.tt { position: absolute; pointer-events: none; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 8px 24px -10px rgba(0,0,0,.35); padding: 6px 10px; font-size: 12px; white-space: nowrap; z-index: 3; }
.tt .t { color: var(--muted); }
.tbl { overflow-x: auto; max-height: 34rem; }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th { position: sticky; top: 0; background: var(--panel); text-align: left; color: var(--muted); font-size: 12px; font-weight: 500; padding: 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
td.n, th.n { text-align: right; white-space: nowrap; }
tr.click { cursor: pointer; } tr.click:hover td { background: var(--soft); }
.src { font-size: 11px; color: var(--muted); border: 1px solid var(--line); border-radius: 6px; padding: 0 5px; margin-left: 6px; }
.cal { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
.cal .h { text-align: center; font-size: 11px; color: var(--muted); }
.cal .c { border: 1px solid var(--line); border-radius: 8px; padding: 4px 6px; min-height: 44px; display: flex; flex-direction: column; justify-content: space-between; font-size: 11px; min-width: 0; }
.cal .c .v { text-align: right; font-family: var(--mono); font-size: 10px; overflow: hidden; }
.cal .c.fut { opacity: .4; }
.vs { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 8px 16px; align-items: baseline; }
.vs .h { color: var(--muted); font-size: 12px; }
.vs .r { text-align: right; font-variant-numeric: tabular-nums; }

/* controls */
.controls { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 12px; align-items: end; }
label.f { display: grid; gap: 3px; font-size: 12px; color: var(--muted); flex: 1 1 9rem; min-width: 0; }
input, select, textarea { background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 9px 10px; min-height: 42px; min-width: 0; width: 100%; box-sizing: border-box; }
textarea { min-height: 90px; font-family: var(--mono); font-size: 12px; }
.btn { border: 1px solid var(--ink); background: var(--ink); color: var(--bg); border-radius: 10px; padding: 9px 16px; min-height: 42px; font-weight: 500; }
.btn.ghost { background: transparent; color: var(--ink); }
.btn.danger { background: transparent; color: var(--bad); border-color: var(--bad); }
.btn.small { min-height: 34px; padding: 4px 10px; font-size: 13px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.seg button { background: none; border: 0; padding: 8px 14px; min-height: 40px; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.code { font-family: var(--mono); font-size: 12px; background: var(--soft); border-radius: 8px; padding: 10px; word-break: break-all; user-select: all; }
ol.steps { margin: 0; padding-left: 20px; display: grid; gap: 6px; }

/* fab, dialog, toast */
.fab { position: fixed; right: calc(18px + env(safe-area-inset-right, 0px)); bottom: calc(18px + env(safe-area-inset-bottom, 0px)); z-index: 20; display: inline-flex; gap: 8px; align-items: center; background: var(--sun); color: #10231F; border: 0; border-radius: 99px; padding: 14px 20px; font-weight: 600; box-shadow: 0 10px 28px -10px rgba(0,0,0,.45); min-height: 52px; }
.scrim { position: fixed; inset: 0; background: rgba(8, 20, 17, .45); z-index: 30; display: grid; place-items: end center; padding-left: max(0px, env(safe-area-inset-left, 0px)); padding-right: max(0px, env(safe-area-inset-right, 0px)); }
.sheet { background: var(--panel); width: min(560px, 100%); border-radius: 20px 20px 0 0; padding: 20px 20px calc(20px + env(safe-area-inset-bottom, 0px)); max-height: 92vh; overflow: auto; box-sizing: border-box; }
@media (min-width: 700px) { .scrim { place-items: center; } .sheet { border-radius: 20px; } }
.sheet h2 { font-family: var(--display); font-size: 22px; margin: 0 0 14px; }
.form { display: grid; gap: 12px; }
.form .two { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 10px; }
.amount { font-family: var(--mono); font-size: 26px !important; }
.hint { font-size: 12px; color: var(--muted); }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(84px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 12px; z-index: 40; font-size: 14px; max-width: calc(100% - 32px); }
.empty { color: var(--muted); font-size: 14px; padding: 12px 0; }
.ed-row { display: grid; gap: 8px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 8rem), 1fr)) auto; align-items: end; padding: 10px 0; border-bottom: 1px solid var(--line); }
.card-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 4px; }
.card-head h2 { margin: 0; }
.llist { display: grid; }
.lrow { display: flex; align-items: center; gap: 10px; width: 100%; background: none; border: 0; border-bottom: 1px solid var(--line); padding: 10px 2px; text-align: left; min-height: 50px; color: inherit; }
.llist .lrow:last-child { border-bottom: 0; }
.lrow:hover { background: var(--soft); }
.lmain { flex: 1; min-width: 0; display: grid; }
.lsub { color: var(--muted); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lright { font-variant-numeric: tabular-nums; white-space: nowrap; }
.chev { flex: none; color: var(--muted); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.cchip { border: 1px solid var(--line); background: var(--bg); color: var(--ink); border-radius: 99px; padding: 6px 12px; min-height: 36px; font-size: 13px; }
button.cchip:hover { border-color: var(--ink); }
span.cchip { min-height: 0; padding: 3px 10px; font-size: 12px; line-height: 1.4; }
.cchip .m { color: var(--muted); font-size: 11px; margin-left: 4px; }
.grp { display: grid; gap: 6px; margin-top: 12px; }
.grp-h { font-size: 12px; color: var(--muted); }
.grp-h b { color: var(--ink); font-weight: 600; }
.calc { display: grid; gap: 0; }
.calc .row { align-items: baseline; }
.calc .tot { border-top: 2px solid var(--ink); border-bottom: 0; font-weight: 600; }
.hlink { background: none; border: 0; color: inherit; text-decoration: underline; text-underline-offset: 3px; padding: 4px 0; font-size: 13px; justify-self: start; min-height: 32px; opacity: .95; }
.checks { display: grid; gap: 4px; max-height: 14rem; overflow: auto; border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; }
.checks label { display: flex; gap: 8px; align-items: center; font-size: 14px; color: var(--ink); min-height: 32px; }
.checks input { width: auto; min-height: 0; }
.x { background: none; border: 1px solid var(--line); border-radius: 8px; min-width: 42px; min-height: 42px; color: var(--muted); }
@media (max-width: 760px) { .hero { grid-template-columns: minmax(0, 1fr); } .fab span { display: none; } .fab { padding: 14px 16px; } }
@media (prefers-reduced-motion: no-preference) { .sheet { animation: up .22s ease-out; } @keyframes up { from { transform: translateY(16px); opacity: .6; } } }
</style>

</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand"><svg width="26" height="26" viewBox="0 0 28 28" aria-hidden="true"><circle cx="14" cy="14" r="12" fill="none" stroke="var(--accent)" stroke-width="2.5"></circle><path d="M14 2a12 12 0 0 1 0 24" fill="var(--accent)"></path></svg>Avanzo</div>
    <div class="who" id="who"></div>
  </header>
  <div id="demoBar" class="demo-bar" hidden><span><b>Questa è la demo.</b> Chiara è una persona inventata: prova pure tutto. Per usare Avanzo con i tuoi conti serve Plus.</span><button class="btn small" id="startOwn">Usa i miei conti</button></div>
  <section class="hero" id="hero"></section>
  <nav class="tabs" role="tablist" aria-label="Sezioni" id="tabs"></nav>
  <main id="view"></main>
  <p class="hint" style="margin-top:32px">Avanzo è un'app indipendente. I dati restano in questo browser: nessun server, nessun account. Le informazioni hanno scopo organizzativo e non sono consulenza finanziaria.</p>
</div>
<button class="fab" id="fab" aria-label="Nuova transazione"><svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"></path></svg><span>Nuova transazione</span></button>
<div id="modal"></div>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
/* ================= LOGICA PURA (nessun DOM) ================= */
const MS = (() => {
  const pad = (n) => String(n).padStart(2, '0');
  const iso = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  const pd = (s) => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d || 1, 12); };
  const ym = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}`;
  const dim = (y, m) => new Date(y, m + 1, 0).getDate(); // m 0-based
  const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
  const addMonths = (d, n) => new Date(d.getFullYear(), d.getMonth() + n, 1, 12);
  const mIndex = (s) => { const [y, m] = s.split('-').map(Number); return y * 12 + m - 1; };
  const uid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);
  const round2 = (n) => Math.round(n * 100) / 100;

  const CATEGORIE = [
    ['Affitto', 'indispensabile', true], ['Bollette luce e gas', 'indispensabile', true], ['Acqua', 'indispensabile', true],
    ['Internet e telefono', 'indispensabile', true], ['Rata auto', 'indispensabile', true], ['Rata smartphone', 'indispensabile', true],
    ['Assicurazione auto', 'indispensabile', true], ['Spesa alimentare', 'necessaria', false], ['Carburante', 'necessaria', false],
    ['Trasporti pubblici', 'necessaria', false], ['Salute e farmacia', 'necessaria', false], ['Casa e manutenzione', 'necessaria', false],
    ['Ristoranti e bar', 'desiderio', false], ['Abbigliamento', 'desiderio', false], ['Svago e uscite', 'desiderio', false],
    ['Abbonamenti streaming', 'desiderio', true], ['Palestra', 'desiderio', true], ['Regali', 'desiderio', false], ['Viaggi', 'desiderio', false],
    ['Da classificare', 'desiderio', false], ['Stipendio', 'entrata', false], ['Altre entrate', 'entrata', false], ['Trasferimento', 'trasferimento', false],
  ].map(([nome, natura, fissa]) => ({ nome, natura, fissa }));

  function rng(seed) { return () => { seed |= 0; seed = (seed + 0x6D2B79F5) | 0; let t = Math.imul(seed ^ (seed >>> 15), 1 | seed); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }

  /* Dati inventati per la demo, sempre aggiornati a oggi */
  function demo(today) {
    const R = rng(42); const rnd = (a, b) => a + R() * (b - a); const pick = (xs) => xs[Math.floor(R() * xs.length)];
    const T = new Date(today.getFullYear(), today.getMonth(), today.getDate(), 12);
    const start = addMonths(T, -4);
    const mov = []; const add = (d, imp, cat, desc, conto = 'cc', fonte = 'demo') => { if (d <= T) mov.push({ id: uid(), data: iso(d), importo: round2(imp), categoria: cat, descrizione: desc, conto, fonte }); };
    const fixed = [['Affitto', 'Affitto', 1, 650], ['Palestra', 'Palestra', 3, 39], ['Rata auto', 'Rata auto', 5, 189], ['Internet casa + mobile', 'Internet e telefono', 10, 34.9], ['Streaming video + musica', 'Abbonamenti streaming', 12, 21.98], ['Bolletta acqua', 'Acqua', 14, 38.2], ['Rata smartphone', 'Rata smartphone', 15, 39], ['Bolletta luce e gas', 'Bollette luce e gas', 20, 0], ['Assicurazione auto (rata)', 'Assicurazione auto', 22, 47.5]];
    const luce = [62.4, 58.1, 55.75, 71.3, 66.2];
    const P = { spesa: ['Supermercato Il Grano', 'Discount Sì&Risparmio', 'Mercato rionale'], bar: ['Bar Centrale', 'Pizzeria Da Gigi', 'Sushi Hana', 'Osteria al Ponte', 'Bar Pasticceria Dolce'], abiti: ['Negozio Filo&Co', 'Calzature Passo', 'Outlet online'], svago: ['Cinema Astra', 'Libreria Pagine', 'Bowling Strike'], salute: ['Farmacia San Marco', 'Ottica Lenti Chiare'], casa: ['Ferramenta Bortolin', 'Casalinghi Nadia'] };
    const curYm = ym(T);
    for (let d = new Date(start); d <= T; d = addDays(d, 1)) {
      const day = d.getDate(), wd = (d.getDay() + 6) % 7, mo = ym(d);
      if (day === 27) add(d, 1950, 'Stipendio', 'Studio Grafico Esempio Srl');
      fixed.forEach(([n, c, g, a], i) => {
        if (day !== g) return;
        if (mo === curYm && (c === 'Acqua' || c === 'Bollette luce e gas')) return; // ancora da pagare
        add(d, -(c === 'Bollette luce e gas' ? luce[(d.getMonth()) % 5] : a), c, n);
      });
      if (day === 2) { add(d, -250, 'Trasferimento', 'Ricarica carta prepagata'); add(d, 250, 'Trasferimento', 'Ricarica carta prepagata', 'cp'); }
      if (day === 28) { add(d, -100, 'Trasferimento', 'Accantonamento fondo emergenze'); add(d, 100, 'Trasferimento', 'Accantonamento fondo emergenze', 'cd'); }
      if (wd === 1 || wd === 5) add(d, -rnd(20, 42) * (wd === 5 ? 1.2 : 1), 'Spesa alimentare', pick(P.spesa));
      if (R() < 0.12) add(d, -rnd(4, 15), 'Spesa alimentare', 'Panificio Aurora');
      if (day === 8 || day === 18 || day === 28) add(d, -rnd(45, 62), 'Carburante', pick(['Distributore Via Roma', 'Stazione Est']), 'cp');
      if ((wd === 0 || wd === 2) && R() < 0.35) add(d, -pick([1.7, 3.4, 6.8]), 'Trasporti pubblici', pick(['Biglietto bus urbano', 'Treno regionale']), 'cp');
      if (R() < (wd >= 4 ? 0.55 : 0.22)) { const big = wd >= 4 && R() < 0.5; add(d, -(big ? rnd(18, 38) : rnd(2.5, 9)), 'Ristoranti e bar', pick(P.bar), big ? 'cc' : 'cp'); }
      if (R() < 0.07) add(d, -rnd(18, 75), 'Abbigliamento', pick(P.abiti));

  /* Converte i dati salvati dalle versioni precedenti */
  function migra(S) {
    if (!S) return S;
    if (S.budget && !Array.isArray(S.budget)) S.budget = Object.entries(S.budget).filter(([, l]) => Number(l) > 0).map(([c, l]) => ({ id: uid(), nome: c, limite: Number(l), categorie: [c] }));
    if (!S.budget) S.budget = [];
    if (!S.regole) S.regole = {}; if (!S.importati) S.importati = [];

  /* Unisce i dati di due dispositivi.

     - Impostazioni, conti, categorie, scadenze, debiti e budget arrivano dal lato modificato per ultimo. */
  function unisci(a, b) {
    a = migra(JSON.parse(JSON.stringify(a))); b = migra(JSON.parse(JSON.stringify(b)));
    if (a.base !== b.base) return a.base > b.base ? a : b;
    const recente = (a.mod || 0) >= (b.mod || 0) ? a : b;
    const out = JSON.parse(JSON.stringify(recente));
    const tomb = new Set([...a.eliminati, ...b.eliminati]);
    const per = new Map();
    [...b.movimenti, ...a.movimenti].forEach((m) => { const o = per.get(m.id); if (!o || (m.mod || 0) >= (o.mod || 0)) per.set(m.id, m); });
    out.movimenti = [...per.values()].filter((m) => !tomb.has(m.id)).sort((x, y) => x.data < y.data ? -1 : x.data > y.data ? 1 : 0);
    out.eliminati = [...tomb].slice(-3000);
    out.importati = [...new Set([...a.importati, ...b.importati])].slice(-300);
    out.regole = { ...(recente === a ? b : a).regole, ...recente.regole };
    out.mod = Math.max(a.mod || 0, b.mod || 0);
    return out;
  }

  function vuoto() {
    return { v: 1, demo: false, base: Date.now(), impostazioni: { nome: '', giornoStipendio: 27, stipendio: 0, obiettivoRisparmio: 100, fondoObiettivo: 3000, contoFondo: '', quotaFondo: 0, contoPredefinito: 'cc' }, conti: [{ id: 'cc', nome: 'Conto corrente', tipo: 'banca', saldoIniziale: 0 }], categorie: CATEGORIE.map((c) => ({ ...c })), movimenti: [], scadenze: [], debiti: [], budget: [], regole: {}, importati: [] };

  /* Calcoli: tutto deriva dai movimenti */
  function calc(S, today, goalOverride) {
    const T = new Date(today.getFullYear(), today.getMonth(), today.getDate(), 12);
    const tIso = iso(T), curYm = ym(T), I = S.impostazioni;
    const cat = Object.fromEntries(S.categorie.map((c) => [c.nome, c]));
    const natura = (c) => (cat[c] ? cat[c].natura : (c === 'Trasferimento' ? 'trasferimento' : 'desiderio'));
    const fissa = (c) => !!(cat[c] && cat[c].fissa);
    const isTr = (m) => natura(m.categoria) === 'trasferimento';
    const spese = S.movimenti.filter((m) => m.importo < 0 && !isTr(m));
    const entrate = S.movimenti.filter((m) => m.importo > 0 && !isTr(m));

    // conti
    const saldi = S.conti.map((c) => ({ ...c, saldo: round2(c.saldoIniziale + S.movimenti.filter((m) => m.conto === c.id).reduce((s, m) => s + m.importo, 0)) }));

    const usciteMedie = round2(-spese.filter(inMesi).reduce((s, m) => s + m.importo, 0) / nM);
    const saldoMedio = round2(entrateMedie - usciteMedie);
    const mediaCat = {};

    // spese necessarie = categorie non fisse di tipo indispensabile o necessaria; a scelta = desiderio
    const varDay = (nats) => Object.entries(mediaCat).filter(([c]) => !fissa(c) && nats.includes(natura(c))).reduce((s, [, v]) => s + v, 0) / 30.4;
    const necDay = varDay(['indispensabile', 'necessaria']), desDay = varDay(['desiderio']);

      const n = new Date(T.getFullYear(), T.getMonth() + 1, Math.min(s.giorno, dim(T.getFullYear(), T.getMonth() + 1)), 12);
      if (n < pay) occ.push({ ...s, data: iso(n), stato: 'da pagare' });

    const daPagare = occ.filter((s) => s.stato !== 'pagata' && pd(s.data) < pay);
    const totDaPagare = round2(daPagare.reduce((s, x) => s + x.importo, 0));

    const pctOggi = round2(T.getDate() / dim(T.getFullYear(), T.getMonth()) * 100);

    // debiti
    const debiti = S.debiti.map((d) => {
      const rim = Math.max(0, mIndex(d.ultimaRata) - mIndex(curYm) + (T.getDate() < d.giorno ? 1 : 0));
      return { ...d, rimanenti: rim, residuo: round2(rim * d.rata), siLibera: ym(addMonths(pd(d.ultimaRata + '-01'), 1)) };
    });

    // analisi
    const mesiAn = [-4, -3, -2, -1, 0].map((k) => ym(addMonths(T, k)));
    const naturaMesi = mesiAn.map((m) => { const r = { mese: m, indispensabile: 0, necessaria: 0, desiderio: 0 }; spese.filter((x) => x.data.startsWith(m)).forEach((x) => { const n = natura(x.categoria); if (r[n] != null) r[n] -= x.importo; }); return r; });
    const prevYm = ym(addMonths(T, -1));
    const cum = (m, upTo) => { const out = []; let c = 0; for (let d = 1; d <= upTo; d++) { const k = `${m}-${pad(d)}`; c += -spese.filter((x) => x.data === k).reduce((s, x) => s + x.importo, 0); out.push(round2(c)); } return out; };
    const pm = addMonths(T, -1);

    spese.filter(inMesi).filter((m) => !fissa(m.categoria)).forEach((m) => { wdTot[(pd(m.data).getDay() + 6) % 7] -= m.importo; });

    const des = categorie.filter((c) => !c.fissa && c.natura === 'desiderio').reduce((s, c) => s + c.media, 0);

    const pianoRighe = categorie.filter((c) => c.media > 0).map((c) => ({ categoria: c.categoria, natura: c.natura, fissa: c.fissa, oggi: c.media, piano: round2(c.fissa ? c.media : c.natura === 'desiderio' ? c.media * k : c.media * 0.95) }));
    const pianoTot = round2(pianoRighe.reduce((s, r) => s + r.piano, 0));

    occ.filter((s) => s.stato === 'in ritardo').forEach((s) => cons.push(['bad', `Paga ${s.nome} (${eur(s.importo)}): era in scadenza il ${dl(s.data)}.`]));
    budget.filter((b) => b.pct > 100).forEach((b) => cons.push(['bad', `Budget «${b.nome}» superato (${eur(b.speso)} su ${eur(b.limite)}).`]));
    if (daPagare.filter((s) => s.stato === 'da pagare').length) { const dp = daPagare.filter((s) => s.stato === 'da pagare'); cons.push(['warn', `Tieni da parte ${eur(dp.reduce((s, x) => s + x.importo, 0))} per ${dp.length} ${dp.length === 1 ? 'scadenza' : 'scadenze'} prima dello stipendio (${dp.map((s) => s.nome).join(', ')}).`]); }

      necessarie: spesaCats.filter((c) => !c.fissa && c.natura !== 'desiderio').map((c) => ({ nome: c.nome, media: mediaDi(c.nome) })).sort((a, b) => b.media - a.media),

  }

  const nf = new Intl.NumberFormat('it-IT', { style: 'currency', currency: 'EUR' });

  /* Importo scritto in qualunque modo: "€12,50", "12.50", "-1.234,56 €" */

  }

  /* Link delle scorciatoie: ...#nuova?importo=12,50&descrizione=Bar&conto=Visa&fonte=iphone&salva=1 */
  function parseLink(str) {

  function nuovaDaLink(S, L, today) {

    const conto = (findConto(L.conto) || S.conti.find((c) => c.id === S.impostazioni.contoPredefinito) || S.conti.find((c) => c.tipo !== 'risparmio') || S.conti[0]);

      <div class="card"><h2>Come fai oggi e con il piano</h2><p class="note">Obiettivo: ${esc(eur0(P.goal))} di risparmio al mese${P.raggiungibile ? '' : ' (non raggiungibile solo tagliando le spese a scelta)'}</p>
        <div class="vs"><span class="h"></span><span class="h r">Oggi</span><span class="h r">Con il piano</span>
          <span>Uscite al mese</span><span class="r">${esc(eur0(C.usciteMedie))}</span><b class="r ok">${esc(eur0(P.tot))}</b>
          <span>Risparmio reale al mese</span><span class="r ${C.saldoMedio < 0 ? 'bad' : ''}">${esc(eur0(C.saldoMedio))}</span><b class="r ok">${esc(eur0(P.risparmio))}</b>
          <span>Spese a scelta</span><span class="r">${esc(eur0(desOggi))}</span><b class="r ok">${esc(eur0(desPiano))}</b>
          <span>Fondo emergenze pieno</span><span class="r">${esc(arr(C.mesiFondo(C.quota)))}</span><b class="r ok">${esc(arr(C.mesiFondo(P.goal)))}</b>
        </div>
        <div style="margin-top:16px;display:flex;gap:10px;flex-wrap:wrap"><button class="btn" id="applyPlan">Applica il piano ai budget</button></div>
        <p class="hint" style="margin:8px 0 0">Aggiorna i limiti dei tuoi budget con i valori del piano e crea quelli che mancano.</p>
      </div>
      <div class="card"><h2>Simulatore di risparmio</h2><p class="note">Cambia i numeri e imposta il risultato come obiettivo</p>
        <div class="controls"><label class="f" for="simStart">Saldo di partenza (€)<input id="simStart" type="number" step="50" inputmode="decimal" value="${round2(C.fondo)}"></label><label class="f" for="simGoal">Obiettivo (€)<input id="simGoal" type="number" step="100" inputmode="decimal" value="${S.impostazioni.fondoObiettivo}"></label></div>
        <div class="controls"><div class="seg" role="group" aria-label="Calcola per"><button id="simQ" aria-pressed="${UI.sim.mode === 'quota'}">Quota mensile</button><button id="simM" aria-pressed="${UI.sim.mode === 'mesi'}">Mesi</button></div><label class="f" for="simVal">${UI.sim.mode === 'quota' ? 'Quota al mese (€)' : 'Numero di mesi'}<input id="simVal" type="number" min="1" inputmode="decimal" value="${UI.sim.mode === 'quota' ? P.goal : 18}"></label></div>
        <div class="big num" id="simOut" style="font-family:var(--mono);font-size:26px">—</div><p class="note" id="simOut2" style="margin:2px 0 12px"></p>
        <button class="btn" id="simSet">Imposta come obiettivo</button>
      </div>
    </div>
    <div class="grid">
      <div class="card"><h2>Budget proposto</h2><p class="note">Fisse = reale · essenziali = media −5% · a scelta tagliate fino all'obiettivo</p><div class="tbl"><table><thead><tr><th>Categoria</th><th class="n">Oggi</th><th class="n">Piano</th><th class="n">Differenza</th></tr></thead><tbody>${P.righe.map((r) => { const d = r.piano - r.oggi; return `<tr><td>${esc(r.categoria)}</td><td class="n">${esc(eur0(r.oggi))}</td><td class="n">${esc(eur0(r.piano))}</td><td class="n ${d < -0.5 ? 'ok' : ''}">${Math.abs(d) < 0.5 ? '—' : esc(eur0(d))}</td></tr>`; }).join('')}</tbody></table></div></div>
      <div class="card"><h2>Previsione a 6 mesi</h2><p class="note">Liquidità più fondo emergenze a fine mese</p>${legend([['Con il piano', 'var(--s1)'], ['Come fai oggi', 'var(--s-muted)']])}<div class="chart" id="ch6"></div></div>
    </div>`;
  };

  V.movimenti = () => {
    const f = UI.filtri; const cats = [...new Set(S.movimenti.map((m) => m.categoria))].sort();
    const rows = S.movimenti.slice().sort((a, b) => a.data < b.data ? 1 : a.data > b.data ? -1 : 0).filter((m) => (!f.q || (m.descrizione + ' ' + m.categoria).toLowerCase().includes(f.q.toLowerCase())) && (!f.conto || m.conto === f.conto) && (!f.cat || m.categoria === f.cat) && (!f.tipo || (f.tipo === 'in' ? m.importo > 0 : m.importo < 0)));
    return `<div class="card"><h2>Movimenti</h2><p class="note">${rows.length} di ${S.movimenti.length} · tocca una riga per modificarla</p>
      <div class="controls"><label class="f" for="fq" style="flex:2 1 14rem">Cerca<input id="fq" type="search" value="${esc(f.q)}" placeholder="Descrizione o categoria"></label>
        <label class="f" for="fc">Conto<select id="fc"><option value="">Tutti</option>${S.conti.map((c) => `<option value="${esc(c.id)}" ${f.conto === c.id ? 'selected' : ''}>${esc(c.nome)}</option>`).join('')}</select></label>
        <label class="f" for="fk">Categoria<select id="fk"><option value="">Tutte</option>${cats.map((c) => `<option ${f.cat === c ? 'selected' : ''}>${esc(c)}</option>`).join('')}</select></label>
        <label class="f" for="ft">Tipo<select id="ft"><option value="">Tutti</option><option value="out" ${f.tipo === 'out' ? 'selected' : ''}>Uscite</option><option value="in" ${f.tipo === 'in' ? 'selected' : ''}>Entrate</option></select></label></div>
      <div class="tbl"><table><thead><tr><th>Data</th><th>Descrizione</th><th>Categoria</th><th>Conto</th><th class="n">Importo</th></tr></thead><tbody>${rows.slice(0, 300).map((m) => `<tr class="click" data-id="${esc(m.id)}" tabindex="0"><td>${esc(ds(m.data))}</td><td>${esc(m.descrizione)}${m.fonte && m.fonte !== 'manuale' && m.fonte !== 'demo' ? `<span class="src">${esc(m.fonte)}</span>` : ''}</td><td class="${m.categoria === 'Da classificare' ? 'warn' : ''}">${esc(m.categoria)}</td><td>${esc(contoNome(m.conto))}</td><td class="n ${m.importo > 0 ? 'ok' : ''}">${m.importo > 0 ? '+' : ''}${esc(eur(m.importo))}</td></tr>`).join('')}</tbody></table>${rows.length > 300 ? '<p class="note">Mostrati i primi 300: usa la ricerca per gli altri.</p>' : ''}${rows.length ? '' : '<p class="empty">Nessun movimento. Usa il tasto + per aggiungerne uno.</p>'}</div></div>`;
  };

  const lrow = (kind, i, main, sub, right) => `<button class="lrow" data-ed="${kind}" data-i="${i}"><span class="lmain"><span>${esc(main)}</span><span class="lsub">${esc(sub)}</span></span><span class="lright">${esc(right)}</span><svg class="chev" width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg></button>`;

  /* ---------- pannello di modifica per conti, scadenze, budget, debiti, categorie ---------- */
  const TIPI_CAT = [['necessaria', 'Necessaria – tolta prima del calcolo'], ['desiderio', 'A scelta – pagata con quello che puoi spendere'], ['indispensabile', 'Indispensabile – come necessaria'], ['entrata', 'Entrata']];
  const ED = {
    conti: { t: 'conto', nuovo: () => ({ id: uid(), nome: '', tipo: 'banca', saldoIniziale: 0 }), campi: () => [['nome', 'Nome', 'text'], ['tipo', 'Tipo', 'select', [['banca', 'Banca'], ['carta', 'Carta'], ['contanti', 'Contanti'], ['risparmio', 'Risparmio (escluso dalla liquidità)']]], ['saldoIniziale', 'Saldo prima del primo movimento (€)', 'num']] },
    scadenze: { t: 'scadenza', nuovo: () => ({ id: uid(), nome: '', categoria: (S.categorie.find((c) => c.fissa) || S.categorie[0]).nome, giorno: 1, importo: 0 }), campi: () => [['nome', 'Nome', 'text'], ['categoria', 'Categoria', 'select', S.categorie.filter((c) => c.natura !== 'entrata' && c.natura !== 'trasferimento').map((c) => [c.nome, c.nome])], ['giorno', 'Giorno del mese', 'int'], ['importo', 'Importo (€)', 'num']] },
    budget: { t: 'budget', nuovo: () => ({ id: uid(), nome: '', limite: 0, categorie: [] }), campi: () => [['nome', 'Nome del budget', 'text'], ['limite', 'Limite al mese (€)', 'num'], ['categorie', 'Categorie che ne fanno parte', 'multi', S.categorie.filter((c) => c.natura !== 'entrata' && c.natura !== 'trasferimento').map((c) => c.nome)]] },
    debiti: { t: 'debito', nuovo: () => ({ id: uid(), nome: '', rata: 0, giorno: 1, ultimaRata: MS.ym(MS.addMonths(new Date(), 12)) }), campi: () => [['nome', 'Nome', 'text'], ['rata', 'Rata mensile (€)', 'num'], ['giorno', 'Giorno della rata', 'int'], ['ultimaRata', 'Mese dell\'ultima rata', 'month']] },
    categorie: { t: 'categoria', nuovo: () => ({ nome: '', natura: 'desiderio', fissa: false }), campi: () => [['nome', 'Nome', 'text'], ['natura', 'Tipo', 'select', TIPI_CAT], ['fissa', 'Spesa fissa ogni mese (affitto, rate, abbonamenti)', 'bool']] },
  };
  function openEditor(kind, i) {
    const def = ED[kind], nuovo = i < 0, item = nuovo ? def.nuovo() : JSON.parse(JSON.stringify(S[kind][i]));
    const campo = ([k, l, t, opts]) => {
      const id = 'ed_' + k, v = item[k];
      if (t === 'select') return `<label class="f" for="${id}">${esc(l)}<select id="${id}">${opts.map(([val, lab]) => `<option value="${esc(val)}" ${String(v) === String(val) ? 'selected' : ''}>${esc(lab)}</option>`).join('')}</select></label>`;
      if (t === 'bool') return `<label class="f" for="${id}">${esc(l)}<select id="${id}"><option value="0" ${!v ? 'selected' : ''}>No</option><option value="1" ${v ? 'selected' : ''}>Sì</option></select></label>`;
      if (t === 'multi') return `<div class="f">${esc(l)}<div class="checks" id="${id}">${opts.map((n) => `<label><input type="checkbox" value="${esc(n)}" ${(v || []).includes(n) ? 'checked' : ''}>${esc(n)}</label>`).join('')}</div></div>`;
      const typ = t === 'month' ? 'month' : t === 'text' ? 'text' : 'text';
      const val = t === 'num' ? String(v ?? '').replace('.', ',') : (v ?? '');
      return `<label class="f" for="${id}">${esc(l)}<input id="${id}" type="${typ}" ${t === 'num' || t === 'int' ? 'inputmode="decimal"' : ''} value="${esc(val)}" autocomplete="off"></label>`;
    };
    $('modal').innerHTML = `<div class="scrim" id="scrim"><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="edTitle">
      <h2 id="edTitle">${nuovo ? (kind === 'categorie' ? 'Nuova ' : kind === 'scadenze' ? 'Nuova ' : 'Nuovo ') + def.t : 'Modifica ' + def.t}</h2>
      <form class="form" id="edForm" novalidate>${def.campi().map(campo).join('')}
        <p class="hint" id="edErr" role="alert"></p>
        <div class="controls" style="margin:0"><button class="btn" type="submit">Salva</button><button class="btn ghost" type="button" id="edCancel">Annulla</button>${nuovo ? '' : '<button class="btn danger" type="button" id="edDel">Elimina</button>'}</div>
        <div id="edDelOk" hidden class="demo-bar" style="margin:0"><span>Eliminare ${esc(item.nome || 'questo elemento')}?</span><button class="btn danger small" type="button" id="edDelYes">Elimina</button><button class="btn ghost small" type="button" id="edDelNo">Annulla</button></div>
      </form></div></div>`;
    const close = () => { $('modal').innerHTML = ''; };
    const err = (m) => { $('edErr').textContent = m; };
    $('edCancel').onclick = close;
    $('scrim').addEventListener('click', (e) => { if (e.target.id === 'scrim') close(); });
    if (!nuovo) {
      $('edDel').onclick = () => {
        if (kind === 'conti' && S.movimenti.some((m) => m.conto === item.id)) return err('Questo conto ha dei movimenti: spostali o eliminali prima.');
        if (kind === 'conti' && S.conti.length === 1) return err('Serve almeno un conto.');
        if (kind === 'categorie' && S.movimenti.some((m) => m.categoria === item.nome)) return err('Alcuni movimenti usano questa categoria: rinominala invece di eliminarla.');
        $('edDelOk').hidden = false;
      };
      $('edDelNo').onclick = () => { $('edDelOk').hidden = true; };
      $('edDelYes').onclick = () => {
        S[kind].splice(i, 1);
        if (kind === 'categorie') S.budget.forEach((b) => { b.categorie = (b.categorie || []).filter((c) => c !== item.nome); });
        save(); close(); render(); toast('Eliminato.');
      };
    }
    $('edForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const out = { ...item };
      for (const [k, l, t] of def.campi()) {
        const el = $('ed_' + k);
        if (t === 'multi') out[k] = [...el.querySelectorAll('input:checked')].map((x) => x.value);
        else if (t === 'bool') out[k] = el.value === '1';
        else if (t === 'num') { const n = parseImporto(el.value); out[k] = isNaN(n) ? 0 : n; }
        else if (t === 'int') out[k] = Math.max(1, Math.min(31, parseInt(el.value, 10) || 1));
        else out[k] = el.value.trim();
      }
      if (!out.nome) return err('Scrivi un nome.');
      if (kind === 'budget' && !out.categorie.length) return err('Scegli almeno una categoria.');
      if (kind === 'budget' && !(out.limite > 0)) return err('Scrivi un limite maggiore di zero.');
      if (kind === 'categorie') {
        if (S.categorie.some((c, j) => j !== i && c.nome.toLowerCase() === out.nome.toLowerCase())) return err('Esiste già una categoria con questo nome.');
        if (out.natura === 'entrata') out.fissa = false;
        if (!nuovo && item.nome !== out.nome) {
          const o = item.nome, n = out.nome;
          S.movimenti.forEach((m) => { if (m.categoria === o) m.categoria = n; });
          S.scadenze.forEach((x) => { if (x.categoria === o) x.categoria = n; });
          S.budget.forEach((b) => { b.categorie = (b.categorie || []).map((c) => c === o ? n : c); });
          Object.keys(S.regole).forEach((r) => { if (S.regole[r] === o) S.regole[r] = n; });
        }
      }
      if (nuovo) { if (kind === 'categorie') S.categorie.splice(Math.max(0, S.categorie.findIndex((c) => c.natura === 'entrata')), 0, out); else S[kind].push(out); }
      else S[kind][i] = out;
      save(); close(); render(); toast('Salvato.');
    });
    setTimeout(() => { const f = $('ed_nome'); if (f && nuovo) f.focus(); }, 50);
  }

  V.impostazioni = (C) => {
    const I = S.impostazioni;
    const acc = V.account ? V.account() : ''; const base = NATIVE ? `${SCHEME}://` : location.href.split('#')[0].split('?')[0] + '#';
    const tpl = `${base}nuova?importo=[Importo]&descrizione=[Esercente]&conto=[Carta]&fonte=iphone&salva=1`;
    const tplA = `${base}nuova?importo=%importo&descrizione=%esercente&fonte=android&salva=1`;
    const catOpts = (sel) => S.categorie.filter((c) => c.natura !== 'trasferimento').map((c) => `<option ${c.nome === sel ? 'selected' : ''}>${esc(c.nome)}</option>`).join('');
    const contoOpts = (sel, any) => (any ? '<option value="">—</option>' : '') + S.conti.map((c) => `<option value="${esc(c.id)}" ${c.id === sel ? 'selected' : ''}>${esc(c.nome)}</option>`).join('');
    return `${acc}
    <div class="grid">
      <div class="card"><h2>Profilo e obiettivi</h2><p class="note">Da qui partono tutti i calcoli</p>
        <div class="form">
          <label class="f" for="pNome">Nome<input id="pNome" data-set="nome" value="${esc(I.nome)}"></label>
          <div class="two"><label class="f" for="pStip">Stipendio netto (€)<input id="pStip" data-set="stipendio" type="number" inputmode="decimal" value="${I.stipendio}"></label><label class="f" for="pGiorno">Giorno dello stipendio<input id="pGiorno" data-set="giornoStipendio" type="number" min="1" max="31" value="${I.giornoStipendio}"></label></div>
          <div class="two"><label class="f" for="pObi">Risparmio mensile obiettivo (€)<input id="pObi" data-set="obiettivoRisparmio" type="number" inputmode="decimal" value="${I.obiettivoRisparmio}"></label><label class="f" for="pFondoObi">Fondo emergenze, obiettivo (€)<input id="pFondoObi" data-set="fondoObiettivo" type="number" inputmode="decimal" value="${I.fondoObiettivo}"></label></div>
          <div class="two"><label class="f" for="pFondoC">Conto del fondo<select id="pFondoC" data-set="contoFondo">${contoOpts(I.contoFondo, true)}</select></label><label class="f" for="pQuota">Quota mensile al fondo (€)<input id="pQuota" data-set="quotaFondo" type="number" inputmode="decimal" value="${I.quotaFondo}"></label></div>
          <label class="f" for="pDef">Conto predefinito per il telefono<select id="pDef" data-set="contoPredefinito">${contoOpts(I.contoPredefinito)}</select></label>
        </div></div>
      <div class="card" id="phone"><h2>Collega il telefono</h2><p class="note">Ogni pagamento può arrivare qui da solo, aprendo un link con importo ed esercente</p>
        <h3 style="font-size:15px;margin:8px 0 6px">iPhone (Comandi)</h3>
        <ol class="steps"><li>Apri <b>Comandi</b> › <b>Automazione</b> › <b>+</b> › <b>Transazione</b>.</li><li>Scegli le carte di Wallet da seguire e <b>Esegui immediatamente</b>.</li><li>Aggiungi l'azione <b>URL</b> con il link qui sotto, inserendo al posto di [Importo], [Esercente] e [Carta] le variabili della transazione.</li><li>Aggiungi l'azione <b>Apri URL</b>: si apre Avanzo e la transazione è salvata.</li></ol>
        <div class="code" id="tplI" style="margin:10px 0 6px">${esc(tpl)}</div><button class="btn ghost small" data-copy="tplI">Copia il link</button>
        ${NATIVE ? '' : '<p class="hint">Versione web: su iPhone usala dentro Safari, perché le app aggiunte alla schermata Home hanno una memoria separata. Con l\'app scaricata dallo store questo limite non c\'è.</p>'}
        <h3 style="font-size:15px;margin:14px 0 6px">Android (MacroDroid o Tasker)</h3>
        <ol class="steps"><li>Crea una macro con trigger <b>Notifica ricevuta</b> dall'app della tua banca o di Google Wallet.</li><li>Salva il testo della notifica in variabili: importo (cerca <span class="code" style="display:inline;padding:0 4px">\\d+[.,]\\d{2}</span>) ed esercente.</li><li>Aggiungi l'azione <b>Apri sito web</b> con il link qui sotto, sostituendo le variabili.</li></ol>
        <div class="code" id="tplA" style="margin:10px 0 6px">${esc(tplA)}</div><button class="btn ghost small" data-copy="tplA">Copia il link</button>
        <p class="hint">Senza <b>salva=1</b> il link apre il modulo già compilato da confermare. Le transazioni senza categoria finiscono in "Da classificare"; quando le correggi, Avanzo impara la categoria per quell'esercente.</p>
        <h3 style="font-size:15px;margin:14px 0 6px">Prova un link</h3>
        <div class="controls"><label class="f" for="testLink" style="flex:3 1 16rem">Incolla un link di prova<input id="testLink" value="${esc(base)}nuova?importo=4,20&descrizione=Bar Centrale&fonte=iphone&salva=1"></label><button class="btn" id="testGo">Prova</button></div>
      </div>
    </div>
    <div class="grid">
      <div class="card"><div class="card-head"><h2>Conti</h2><button class="btn ghost small" data-new="conti">+ Aggiungi</button></div>
        <div class="llist">${S.conti.map((c, i) => lrow('conti', i, c.nome, c.tipo, eur((C.saldi.find((x) => x.id === c.id) || {}).saldo))).join('')}</div></div>
      <div class="card"><div class="card-head"><h2>Scadenze</h2><button class="btn ghost small" data-new="scadenze">+ Aggiungi</button></div>
        <div class="llist">${S.scadenze.slice().map((x, i) => [x, i]).sort((a, b) => a[0].giorno - b[0].giorno).map(([x, i]) => lrow('scadenze', i, x.nome, `il ${x.giorno} · ${x.categoria}`, eur(x.importo))).join('') || '<p class="empty">Nessuna scadenza.</p>'}</div></div>
      <div class="card"><div class="card-head"><h2>Budget</h2><button class="btn ghost small" data-new="budget">+ Nuovo budget</button></div>
        <div class="llist">${S.budget.map((b, i) => lrow('budget', i, b.nome, (b.categorie || []).join(', ') || 'nessuna categoria', eur0(b.limite) + '/mese')).join('') || '<p class="empty">Nessun budget.</p>'}</div></div>
      <div class="card"><div class="card-head"><h2>Debiti</h2><button class="btn ghost small" data-new="debiti">+ Aggiungi</button></div>
        <div class="llist">${S.debiti.map((d, i) => lrow('debiti', i, d.nome, `ultima rata ${ml(d.ultimaRata)}`, eur(d.rata) + '/mese')).join('') || '<p class="empty">Nessun debito.</p>'}</div></div>
    </div>
    <div class="card" id="catCard" style="margin-bottom:14px"><div class="card-head"><h2>Categorie</h2><button class="btn ghost small" data-new="categorie">+ Nuova</button></div>
      <p class="note">Il tipo decide il calcolo di "quanto puoi spendere". Tocca una categoria per cambiarla.</p>
      ${[['necessaria', 'Necessarie', 'tolte prima del calcolo, come spese che farai comunque', (c) => !c.fissa && (c.natura === 'necessaria' || c.natura === 'indispensabile')],
         ['desiderio', 'A scelta', 'si pagano con la cifra che puoi spendere', (c) => !c.fissa && c.natura === 'desiderio'],
         ['fissa', 'Fisse', 'contano tramite le scadenze', (c) => c.fissa && c.natura !== 'entrata'],
         ['entrata', 'Entrate', 'stipendio e altre entrate', (c) => c.natura === 'entrata']].map(([k, t, d, f]) => {
        const xs = S.categorie.map((c, i) => [c, i]).filter(([c]) => c.natura !== 'trasferimento' && f(c));
        return `<div class="grp"><div class="grp-h"><b>${t}</b> · ${d}</div><div class="chips">${xs.map(([c, i]) => `<button class="cchip" data-ed="categorie" data-i="${i}">${esc(c.nome)}</button>`).join('') || '<span class="note">nessuna</span>'}</div></div>`;
      }).join('')}

    const m = nuovaDaLink(S, L, new Date());
    if (L.salva) {
      m.mod = Date.now(); S.movimenti.push(m); if (!test) { S.importati.push(L.chiave); S.importati = S.importati.slice(-300); }

    return true;
  }

  async function leggiRemoto() {

    if (error) throw error; return data;
  }
  async function invia() {
    if (!SB || !Sync.user || !Sync.plus) return;
    if (Sync.busy) { Sync.again = true; return; }
    if (!navigator.onLine) { Sync.stato = 'offline'; mostraStato(); return; }
    Sync.busy = true; Sync.stato = 'invio'; mostraStato();
    try {
      for (let t = 0; t < 4; t++) {
        if (Sync.versione === 0) {
          const { error } = await SB.from('stati').insert({ user_id: Sync.user.id, dati: S, versione: 1 });
          if (!error) { Sync.versione = 1; break; }
          if (error.code !== '23505') throw error;
        } else {
          const { data, error } = await SB.from('stati').update({ dati: S, versione: Sync.versione + 1, aggiornato_il: new Date().toISOString() }).eq('user_id', Sync.user.id).eq('versione', Sync.versione).select('versione');
          if (error) throw error;
          if (data && data.length) { Sync.versione = data[0].versione; break; }
        }
        // un altro dispositivo ha salvato nel frattempo: unisco e riprovo
        const r = await leggiRemoto();
        if (r) { S = unisci(S, r.dati); Sync.versione = r.versione; saveLocal(); render(); } else Sync.versione = 0;
      }
      Sync.stato = 'ok'; Sync.ultimo = Date.now();
    } catch (e) { Sync.stato = 'errore'; console.warn('sync', e); setTimeout(programma, 15000); }
    finally { Sync.busy = false; mostraStato(); if (Sync.again) { Sync.again = false; programma(); } }
  }

    if (!SB || !Sync.user || Sync.busy || !navigator.onLine) return;
    if (!Sync.plus) { try { if (await leggiPiano()) { await avviaSync(); render(); toast('Plus è attivo: ora puoi usare Avanzo con i tuoi conti.'); } } catch (e) {} return; }
    try { const r = await leggiRemoto(); if (r && r.versione > Sync.versione) { S = unisci(S, r.dati); Sync.versione = r.versione; saveLocal(); render(); } Sync.stato = 'ok'; Sync.ultimo = Date.now(); mostraStato(); } catch (e) { Sync.stato = 'errore'; mostraStato(); }
  }
  async function accesso(user) {
    if (Sync.user && Sync.user.id === user.id) return;
    Sync.user = user; Sync.stato = 'invio'; mostraStato();
    try { await leggiPiano(); } catch (e) { Sync.plus = false; Sync.piano = null; pianoRicordato(); }
    if (!Sync.plus) { Sync.stato = 'off'; soloDemo(); render(); return; }
    await avviaSync();
  }
  async function avviaSync() {
    const user = Sync.user; Sync.stato = 'invio'; mostraStato();
    try {
      if (S.demo) { const m = await recupera(); if (m) S = m; }
      const r = await leggiRemoto();
      if (!r) { if (S.demo) S = vuoto(); Sync.versione = 0; }
      else if (S.demo) { S = migra(r.dati); Sync.versione = r.versione; }
      else if (S.syncUser === user.id) { S = unisci(S, r.dati); Sync.versione = r.versione; }
      else { S = unisci({ ...S, base: r.dati.base || 1 }, r.dati); Sync.versione = r.versione; }
      S.syncUser = user.id; saveLocal(); render(); await invia();
    } catch (e) { Sync.stato = 'errore'; mostraStato(); }
  }
  async function uscita() {
    clearTimeout(Sync.timer);
    if (SB) await SB.auth.signOut().catch(() => {});
    const eraPlus = Sync.plus; try { localStorage.removeItem(KEY + '.piano'); } catch (e) {} Sync.user = null; Sync.versione = 0; Sync.stato = 'off'; Sync.plus = false; Sync.piano = null;
    S = demo(today()); saveLocal(); UI.tab = 'panoramica'; render(); toast(eraPlus ? 'Sei uscito. I tuoi dati restano salvati nel tuo account.' : 'Sei uscito.');
  }
  window.AvanzoSync = { programma };
  V.account = () => {
    if (!SB) return '';
    const paga = linkPagamento();
    if (Sync.user && Sync.plus) return `<div class="card" id="accountCard" style="margin-bottom:14px"><div class="card-head"><h2>Account</h2><button class="btn ghost small" id="acOut">Esci</button></div><p class="note" style="margin:0">Collegato come <b>${esc(Sync.user.email || '')}</b> · ${esc(NOMI_PIANO[Sync.piano] || 'Plus')} · <span id="syncStato">${esc(statoTesto())}</span></p></div>`;
    if (Sync.user) return `<div class="card" id="accountCard" style="margin-bottom:14px"><div class="card-head"><h2>Account</h2><button class="btn ghost small" id="acOut">Esci</button></div>
      <p class="note">Collegato come <b>${esc(Sync.user.email || '')}</b>. Plus non è ancora attivo su questo account: per ora vedi la demo.</p>
      <p style="margin:0 0 12px">Con il prezzo fondatore hai Avanzo Plus per sempre con un solo pagamento: <b>49,99 €</b> invece di 69,99 €. Al pagamento usa questa stessa email.</p>
      <div class="controls" style="margin:0">${paga ? `<a class="btn" href="${esc(paga)}" target="_blank" rel="noopener">Diventa fondatore – 49,99 €</a>` : ''}<button class="btn ghost" id="acCheck">Ho già pagato, ricontrolla</button></div>
      <p class="hint" id="acErr" role="alert"></p></div>`;
    return `<div class="card" id="accountCard" style="margin-bottom:14px"><h2>Account</h2><p class="note">Entra con la tua email per usare Avanzo con i tuoi conti, su tutti i tuoi dispositivi. Serve Plus. Ti mandiamo un codice, nessuna password.</p>
      <div class="controls" style="margin:0">${Sync.emailInviata
        ? `<p class="note" style="flex:1 1 100%;margin:0">Ti abbiamo scritto a <b>${esc(Sync.emailInviata)}</b>: tocca il link nell'email oppure scrivi qui il codice, se c'è.</p><label class="f" for="acCode">Codice<input id="acCode" inputmode="numeric" autocomplete="one-time-code" maxlength="8" placeholder="123456"></label><button class="btn" id="acVerify">Accedi</button><button class="btn ghost" id="acBack">Cambia email</button>`
        : `<label class="f" for="acEmail" style="flex:2 1 14rem">Email<input id="acEmail" type="email" inputmode="email" autocomplete="email" placeholder="nome@esempio.it"></label><button class="btn" id="acSend">Inviami il codice</button>`}</div>
      <p class="hint" id="acErr" role="alert"></p>${paga ? `<p class="note" style="margin:8px 0 0">Non hai ancora Plus? <a href="${esc(paga)}" target="_blank" rel="noopener">Diventa fondatore a 49,99 €</a>, poi entra con la stessa email.</p>` : ''}</div>`;
  };
  after.account = () => {
    if (!SB) return;
    const err = (m) => { const e = document.getElementById('acErr'); if (e) e.textContent = m; };
    const out = document.getElementById('acOut'); if (out) out.onclick = uscita;
    const chk = document.getElementById('acCheck');
    if (chk) chk.onclick = async () => {
      chk.disabled = true; err('');
      let ok = false; try { ok = await leggiPiano(); } catch (e) {}
      chk.disabled = false;
      if (!ok) return err('Non troviamo ancora il pagamento. Di solito arriva entro un minuto: controlla di aver usato la stessa email, oppure scrivi a ciao@avanzo.me.');
      await avviaSync(); render(); toast('Plus è attivo: ora puoi usare Avanzo con i tuoi conti.');
    };
    const send = document.getElementById('acSend');
    if (send) send.onclick = async () => {
      const email = $('acEmail').value.trim().toLowerCase();
      if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) return err('Scrivi un indirizzo email valido.');
      send.disabled = true; err('');
      const { error } = await SB.auth.signInWithOtp({ email, options: { shouldCreateUser: true, emailRedirectTo: location.origin + location.pathname } });
      send.disabled = false;
      if (error) {
        const lim = error.status === 429 || /rate|limit|seconds/i.test(error.message || '');
        console.warn('otp', error);
        return err(lim ? 'Hai chiesto troppi codici in poco tempo. Usa l\'ultima email ricevuta, oppure riprova tra un\'ora.' : 'Non siamo riusciti a inviare l\'email. Controlla l\'indirizzo e riprova.');
      }
      Sync.emailInviata = email; render();
    };
    const ver = document.getElementById('acVerify');
    if (ver) ver.onclick = async () => {
      const token = $('acCode').value.replace(/\D/g, '');
      if (token.length < 6) return err('Il codice ha 6 cifre: controlla l\'email.');
      ver.disabled = true; err('');
      const { data, error } = await SB.auth.verifyOtp({ email: Sync.emailInviata, token, type: 'email' });
      ver.disabled = false;
      if (error || !data.user) return err('Codice non valido o scaduto. Chiedine uno nuovo.');
      Sync.emailInviata = ''; await accesso(data.user); toast(Sync.plus ? 'Accesso fatto: i tuoi dati ora sono salvati nel tuo account.' : 'Accesso fatto. Attiva Plus per usare i tuoi conti.');
    };
    const back = document.getElementById('acBack'); if (back) back.onclick = () => { Sync.emailInviata = ''; render(); };
  };

  /* ---------- avvio ---------- */
  $('tabs').addEventListener('click', (e) => { const b = e.target.closest('[data-tab]'); if (!b) return; UI.tab = b.dataset.tab; try { localStorage.setItem(KEY + '.tab', UI.tab); } catch (er) {} render(); });
  $('startOwn').onclick = () => {
    if (!SB || Sync.plus) { S = vuoto(); save(); UI.tab = 'impostazioni'; render(); toast('Inizia da profilo, conti e scadenze. Poi aggiungi le transazioni con il tasto +.'); return; }
    goTo('impostazioni', 'accountCard'); toast(Sync.user ? 'Attiva Plus per usare i tuoi conti.' : 'Entra con la tua email: con Plus usi Avanzo con i tuoi conti.');
  };
  let rt; addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(render, 150); });
  if (!TABS.some(([id]) => id === UI.tab)) UI.tab = 'panoramica';
  async function boot() {
    if (Pref) {
      try { const r = await Pref.get({ key: KEY }); if (r && r.value) { const d = JSON.parse(r.value); if (d && d.v) S = migra(d); } } catch (e) {}
    }
    saveLocal(); render(); fromUrl();
    if (SB) {
      SB.auth.onAuthStateChange((ev, session) => { if (ev === 'SIGNED_OUT') { Sync.user = null; mostraStato(); } else if (ev === 'SIGNED_IN' && session && session.user && (!Sync.user || Sync.user.id !== session.user.id)) { Sync.emailInviata = ''; setTimeout(() => { if (Sync.user && Sync.user.id === session.user.id) return; accesso(session.user).then(() => toast(Sync.plus ? 'Accesso fatto: i tuoi dati ora sono salvati nel tuo account.' : 'Accesso fatto. Attiva Plus per usare i tuoi conti.')); }, 0); } });
      let sess = null; try { const { data } = await SB.auth.getSession(); sess = data && data.session; } catch (e) {}
      if (sess && sess.user) await accesso(sess.user); else { soloDemo(); render(); }
      document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') aggiorna(); });
      addEventListener('online', () => programma());
    }
    addEventListener('hashchange', fromUrl);
    if (NATIVE && Cap.Plugins.App) {
      const AppP = Cap.Plugins.App;
      AppP.addListener('appUrlOpen', (ev) => { if (ev && ev.url) handleLink(ev.url, false); });
      try { const l = await AppP.getLaunchUrl(); if (l && l.url) handleLink(l.url, false); } catch (e) {}
      AppP.addListener('resume', () => render());
    } else if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    }
  }
  boot();
})();
</script>

</body>
</html>
